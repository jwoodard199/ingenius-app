<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InGenius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="src/ui/styles.css">
</head>
<body>
<div id="app"></div>
<!-- App template: {{holes}} read values from src/app.js; <sc-if>/<sc-for> are rendered by src/runtime.js. -->
<template id="ig-template">
<div style="{{rootStyle}}">

  <header style="{{headerStyle}}">
    <span role="img" aria-label="InGenius" style="{{logoStyle}}"><svg viewBox="53 -2 52 68" width="100%" height="100%" aria-hidden="true" style="display: block;"><defs><linearGradient id="igBulbGrad" x1="79" y1="0" x2="101" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F7C42A"></stop><stop offset="1" stop-color="#F89522"></stop></linearGradient><clipPath id="igBulbClip"><path d="M67 58.5V51C67 45 57 38.5 57 25.5A22 22 0 0 1 101 25.5C101 38.5 91 45 91 51V58.5Z"></path></clipPath></defs><path d="M67 58.5V51C67 45 57 38.5 57 25.5A22 22 0 0 1 101 25.5C101 38.5 91 45 91 51V58.5Z" fill="#FFFFFF"></path><rect x="79.5" y="0" width="24" height="60" fill="url(#igBulbGrad)" clip-path="url(#igBulbClip)"></rect><path d="M67 58.5V51C67 45 57 38.5 57 25.5A22 22 0 0 1 101 25.5C101 38.5 91 45 91 51V58.5Z" fill="none" stroke="#24285D" stroke-width="4" stroke-linejoin="round"></path><path d="M65 57.5H93V60.5A3 3 0 0 1 90 63.5H68A3 3 0 0 1 65 60.5Z" fill="#24285D"></path></svg></span>
    <sc-if value="{{wide}}" hint-placeholder-val="{{true}}">
      <div style="width: 1px; height: 28px; background: #DADCE8;"></div>
      <div style="display: flex; flex-direction: column;">
        <span style="font-family: Montserrat, sans-serif; font-size: 18px; line-height: 24px; font-weight: 700;">{{pageTitle}}</span>
        <span style="font-size: 13px; line-height: 18px; color: #474945;">{{d.role}} · Thursday, September 25</span>
      </div>
    </sc-if>
    <div style="flex-grow: 1;"></div>
      <sc-if value="{{isHome}}" hint-placeholder-val="{{true}}"><div style="{{homeBarStyle}}">
        <button type="button" onClick="{{homeToggleEdit}}" aria-expanded="{{homeEditAttr}}" aria-label="Customize Home" title="Customize Home" style="{{homeEditBtn}}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><path d="M16.5 13.5v6M13.5 16.5h6"></path></svg>
          <sc-if value="{{wide}}" hint-placeholder-val="{{true}}"><span>Customize</span></sc-if></button>
        <sc-if value="{{homeEdit}}" hint-placeholder-val="{{false}}">
          <div role="dialog" aria-label="Choose your widgets" style="{{homePanelStyle}}">
            <div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px;">
              <span style="font-family: Montserrat, sans-serif; font-size: 16px; line-height: 22px; font-weight: 700;">Choose your widgets</span>
              <span style="font-size: 13px; line-height: 18px; color: #474945;">{{homeCount}} on. Turn widgets on or off. Your picks stay with you.</span>
            </div>
            <sc-for list="{{homeOpts}}" as="o" hint-placeholder-count="7">
              <button type="button" role="switch" aria-checked="{{o.checked}}" onClick="{{o.toggle}}" style="{{o.style}}">
                <span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
                  <span style="font-size: 14px; line-height: 20px; font-weight: 600;">{{o.name}}</span>
                  <span style="font-size: 12px; line-height: 17px; color: #474945;">{{o.desc}}</span>
                  <sc-if value="{{o.hasHint}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; line-height: 16px; color: #474945; font-weight: 600;">{{o.hint}}</span></sc-if>
                </span>
                <span aria-hidden="true" style="{{o.trackStyle}}"><span style="{{o.knobStyle}}"></span></span>
              </button>
            </sc-for>
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #DADCE8; padding-top: 10px; margin-top: 4px;">
              <button type="button" onClick="{{homeReset}}" style="border: none; background: transparent; color: #24285D; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline;">{{homeResetLabel}}</button>
              <button type="button" onClick="{{homeToggleEdit}}" style="height: 32px; padding: 0 14px; border: 1px solid #24285D; border-radius: 8px; background: #24285D; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Done</button>
            </div>
          </div>
        </sc-if>
      </div></sc-if>
    <sc-if value="{{wide}}" hint-placeholder-val="{{true}}">
      <span style="height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border: 1px solid #DADCE8; border-radius: 999px; background: #FFFFFF; font-size: 14px; font-weight: 600;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        {{d.territory}}
      </span>
    </sc-if>
    <button type="button" aria-label="Notifications" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #DADCE8; background: #FFFFFF; color: #24285D; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
    </button>
    <button type="button" onClick="{{openPersona}}" aria-label="Switch persona (prototype)" style="width: 40px; height: 40px; border-radius: 999px; border: none; background: #24285D; color: #FFFFFF; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 13px; cursor: pointer;">{{d.initials}}</button>
  </header>

  <main style="{{mainStyle}}">

    <sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
      <sc-if value="{{homeNone}}" hint-placeholder-val="{{false}}">
        <section style="{{hmCard}}">
          <span style="font-family: Montserrat, sans-serif; font-size: 16px; line-height: 22px; font-weight: 700;">Your Home is empty</span>
          <span style="font-size: 14px; line-height: 20px; color: #474945;">Pick widgets from Customize Home, or reset to the defaults.</span>
          <div><button type="button" onClick="{{homeReset}}" style="{{hmLink}}">{{homeResetLabel}}</button></div>
        </section>
      </sc-if>
      <div style="{{gridStyle}}">
        <div style="{{homeSideStyle}}">
          <sc-if value="{{hw.actions}}" hint-placeholder-val="{{true}}">
          <section style="{{cardStyle}}">
  <div style="display: flex; align-items: center; gap: 8px;">
    <h2 style="margin: 0; flex-grow: 1; font-family: Montserrat, sans-serif; font-size: 18px; line-height: 26px; font-weight: 600;">Action items</h2>
    <span style="font-size: 13px; line-height: 18px; color: #474945;">{{doneCount}} of {{total}} done today</span>
  </div>
  <div style="height: 6px; background: #DADCE8; border-radius: 999px; overflow: hidden;" role="progressbar" aria-valuemin="0" aria-valuemax="{{total}}" aria-valuenow="{{doneCount}}" aria-label="Action items done today">
    <div style="{{progressStyle}}"></div>
  </div>
  <sc-if value="{{allDone}}" hint-placeholder-val="{{false}}">
    <div style="border-radius: 10px; background: #F4F5F9; padding: 12px; display: flex; gap: 8px; align-items: center; color: #1D7A55; font-weight: 600; font-size: 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
      <span>You're done for today. New action items show up here as they appear.</span>
    </div>
  </sc-if>
  <div style="display: flex; flex-direction: column; gap: 4px;">
    <sc-for list="{{tray}}" as="t" hint-placeholder-count="4">
      <div style="{{t.wrapStyle}}">
        <button type="button" onClick="{{t.toggle}}" aria-expanded="{{t.expandedAttr}}" style="display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 12px; border: none; background: transparent; color: #24285D; font-family: inherit; text-align: left; cursor: pointer; border-radius: 10px;">
          <sc-if value="{{t.open}}" hint-placeholder-val="{{true}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9" stroke="#DADCE8" stroke-width="2.4"></circle><circle cx="12" cy="12" r="9" stroke="#24285D" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="{{t.dash}}" transform="rotate(-90 12 12)"></circle></svg>
          </sc-if>
          <sc-if value="{{t.isDone}}" hint-placeholder-val="{{false}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="10" fill="#1D7A55"></circle><path d="m8 12.2 2.8 2.8 5.2-5.6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </sc-if>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
            <span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
              <span style="font-weight: 600; font-size: 15px; line-height: 22px;">{{t.title}}</span>
              <span style="{{t.kindStyle}}">{{t.kind}}</span>
            </span>
            <span style="font-size: 13px; line-height: 19px; color: #474945;">{{t.why}}</span>
            <sc-if value="{{t.isDone}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #1D7A55;">{{t.doneLabel}}</span>
            </sc-if>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#474945" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{t.chevStyle}}"><path d="m9 6 6 6-6 6"></path></svg>
        </button>
        <sc-if value="{{t.showActions}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px 12px 46px;">
            <button type="button" onClick="{{t.act}}" style="height: 44px; padding: 0 20px; border-radius: 8px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; border: 1px solid #24285D; background: #24285D; color: #FFFFFF;">{{t.action}}</button>
            <button type="button" onClick="{{t.snooze}}" style="height: 44px; padding: 0 20px; border-radius: 8px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; border: 1px solid #24285D; background: #FFFFFF; color: #24285D;">Snooze</button>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</section>
          </sc-if>

        </div>
        <div style="{{homeMainStyle}}">
          <sc-if value="{{hw.kpis}}" hint-placeholder-val="{{true}}">
          <div style="{{hwBox}}">
          <div style="{{kpiRow}}">
            <sc-for list="{{kpis}}" as="k" hint-placeholder-count="3">
              <section style="{{kpiCard}}">
                <span style="font-size: 14px; line-height: 20px; color: #474945;">{{k.label}}</span>
                <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;">
                  <span style="font-size: 30px; line-height: 36px; font-weight: 600; font-variant-numeric: tabular-nums;">{{k.value}}</span>
                  <span style="{{k.deltaStyle}}">{{k.delta}}</span>
                </div>
                <span style="font-size: 13px; line-height: 18px; color: #474945;">Compare {{k.compare}} (last month)</span>
              </section>
            </sc-for>
          </div>
          </div>
          </sc-if>

          <sc-if value="{{hw.movement}}" hint-placeholder-val="{{false}}">
          <div style="{{hwBox}}">
            <section style="{{hmCard}}" aria-label="Loan officer movement">
              <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
                  <h2 style="margin: 0; font-family: Montserrat, sans-serif; font-size: 18px; line-height: 26px; font-weight: 600;">Loan officer movement</h2>
                  <span style="font-size: 13px; line-height: 18px; color: #474945;">{{hmMoveSub}}</span>
                </div>
                <button type="button" onClick="{{hmMoveOpen}}" style="{{hmLink}}">Open report
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
              </div>
              <button type="button" onClick="{{hmMoveOpen}}" aria-label="Open the loan officer movement report" style="{{hmBody}}">
                <span style="{{hmMoveStatRow}}">
                  <sc-for list="{{hmMoveStats}}" as="st" hint-placeholder-count="3">
                    <span style="display: flex; flex-direction: column; gap: 0; background: #F4F5F9; border-radius: 10px; padding: 10px 12px; min-width: 0;">
                      <span style="font-family: Montserrat, sans-serif; font-size: 22px; line-height: 30px; font-weight: 700; font-variant-numeric: tabular-nums;">{{st.value}}</span>
                      <span style="font-size: 12px; line-height: 16px; color: #474945; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{st.label}}</span>
                    </span>
                  </sc-for>
                </span>
                <span style="display: flex; flex-direction: column; gap: 0;">
                  <span style="{{hmMoveHead}}">
                    <span>Loan officer</span><span>From</span><span></span><span>To</span><sc-if value="{{wide}}" hint-placeholder-val="{{true}}"><span style="text-align: right;">Units</span></sc-if><span style="text-align: right;">Moved</span>
                  </span>
                  <sc-for list="{{hmMoveRecent}}" as="mv" hint-placeholder-count="6">
                    <span style="{{mv.row}}">
                      <span style="display: flex; align-items: center; gap: 8px; min-width: 0;"><span style="{{mv.dot}}"></span><span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{mv.name}}</span></span>
                      <span style="{{mv.fromStyle}}">{{mv.from}}</span>
                      <span aria-hidden="true" style="color: #8286A8;">→</span>
                      <span style="{{mv.toStyle}}">{{mv.to}}</span>
                      <sc-if value="{{wide}}" hint-placeholder-val="{{true}}"><span style="text-align: right; font-variant-numeric: tabular-nums; color: #474945;">{{mv.units}}</span></sc-if>
                      <span style="text-align: right; color: #474945; white-space: nowrap;">{{mv.when}}</span>
                    </span>
                  </sc-for>
                </span>
              </button>
            </section>
          </div>
          </sc-if>

          <sc-if value="{{hw.pipeline}}" hint-placeholder-val="{{false}}">
          <div style="{{hwBox}}">
            <section style="{{hmCard}}" aria-label="{{d.crmTitle}}">
              <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
                  <h2 style="margin: 0; font-family: Montserrat, sans-serif; font-size: 18px; line-height: 26px; font-weight: 600;">{{d.crmTitle}}</h2>
                  <span style="font-size: 13px; line-height: 18px; color: #474945;">{{plCountTag}} · {{plSummary}}</span>
                </div>
                <button type="button" onClick="{{hmPipeOpen}}" style="{{hmLink}}">Open board
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
              </div>
              <button type="button" onClick="{{hmPipeOpen}}" aria-label="Open the pipeline board" style="{{hmBody}}">
                <span style="display: flex; gap: 2px; height: 12px; border-radius: 999px; overflow: hidden; background: #EEF0F6;">
                  <sc-for list="{{hmPipeSegs}}" as="sg" hint-placeholder-count="5"><span style="{{sg.seg}}"></span></sc-for>
                </span>
                <span style="{{hmPipeLegend}}">
                  <sc-for list="{{hmPipeSegs}}" as="sg" hint-placeholder-count="5">
                    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; min-width: 0;">
                      <span style="{{sg.dot}}"></span>
                      <span style="flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{sg.name}}</span>
                      <span style="font-weight: 600; font-variant-numeric: tabular-nums;">{{sg.n}}</span>
                      <span style="color: #474945; font-variant-numeric: tabular-nums; min-width: 64px; text-align: right;">{{sg.value}}</span>
                    </span>
                  </sc-for>
                </span>
                <span style="display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 19px; background: #F4F5F9; border-radius: 10px; padding: 8px 10px;"><span style="font-weight: 700; white-space: nowrap;">Genie:</span><span>{{plGenieText}}</span></span>
              </button>
            </section>
          </div>
          </sc-if>
          <sc-if value="{{hw.chart}}" hint-placeholder-val="{{true}}">
          <div style="{{hwBox}}">
          <section style="{{cardStyle}}">
            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
              <h2 style="margin: 0; flex-grow: 1; font-family: Montserrat, sans-serif; font-size: 18px; line-height: 26px; font-weight: 600;">{{d.chartTitle}}</h2>
              <span style="height: 34px; display: flex; align-items: center; gap: 4px; padding: 0 12px; border: 1px solid #DADCE8; border-radius: 999px; font-size: 13px; font-weight: 600;">{{d.chartUnit}}
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
              <span style="height: 34px; display: flex; align-items: center; gap: 4px; padding: 0 12px; border: 1px solid #DADCE8; border-radius: 999px; font-size: 13px; font-weight: 600;">Last 30 days
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
            </div>
            <div style="{{chartWrap}}">
              <div style="{{chartSide}}">
                <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 20px;">
                  <span style="display: flex; align-items: center; gap: 8px;"><span style="width: 10px; height: 10px; border-radius: 999px; background: #24285D;"></span>Actual</span>
                  <span style="display: flex; align-items: center; gap: 8px;"><span style="width: 10px; height: 10px; border-radius: 999px; background: #B9BDD8;"></span>Genie projected</span>
                </div>
                <div style="background: #F4F5F9; border: 1px solid #DADCE8; border-radius: 10px; padding: 12px; display: flex; gap: 8px; font-size: 13px; line-height: 19px;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A34F00" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.8L12 16.5l-1.8-5L5 9.7l5.2-1.8z"></path></svg>
                  <span>{{d.chartTip}}</span>
                </div>
                <x-import component-from-global-scope="InGenius.Button" variant="primary" on-click="{{runTip}}">{{d.chartCta}}</x-import>
              </div>
              <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
                <div style="font-size: 13px; line-height: 18px; color: #474945; min-height: 18px;" aria-live="polite">{{readout}}</div>
                <div style="{{plotStyle}}" role="img" aria-label="{{d.chartTitle}}, last 30 days">
                  <sc-for list="{{cols}}" as="c" hint-placeholder-count="30">
                    <div onMouseEnter="{{c.hover}}" style="{{c.style}}">
                      <sc-for list="{{c.dots}}" as="dot" hint-placeholder-count="5">
                        <span style="{{dot}}"></span>
                      </sc-for>
                    </div>
                  </sc-for>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; color: #474945;">
                  <sc-for list="{{xlabels}}" as="x" hint-placeholder-count="6"><span>{{x}}</span></sc-for>
                </div>
              </div>
            </div>
          </section>
          </div>
          </sc-if>

          <sc-if value="{{hw.table}}" hint-placeholder-val="{{true}}">
          <div style="{{hwBox}}">
          <sc-if value="{{wide}}" hint-placeholder-val="{{true}}">
            <section style="{{cardStyle}}">
              <div style="display: flex; align-items: center; gap: 12px;">
                <h2 style="margin: 0; flex-grow: 1; font-family: Montserrat, sans-serif; font-size: 18px; line-height: 26px; font-weight: 600;">{{d.tableTitle}}</h2>
                <button type="button" onClick="{{goExplore}}" style="border: none; background: transparent; color: #A34F00; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 36px;">Open in Explore</button>
              </div>
              <div style="display: flex; gap: 8px; flex-wrap: wrap;" role="tablist" aria-label="Prebuilt views">
  <sc-for list="{{views}}" as="v" hint-placeholder-count="4">
    <button type="button" role="tab" onClick="{{v.pick}}" aria-selected="{{v.pressed}}" style="{{v.style}}">
      <span>{{v.label}}</span>
      <span style="{{v.countStyle}}">{{v.total}}</span>
    </button>
  </sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
  <sc-for list="{{chips}}" as="chip" hint-placeholder-count="3">
    <span style="{{chip.style}}">
      <sc-if value="{{chip.ai}}" hint-placeholder-val="{{false}}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A34F00" stroke-width="2" stroke-linejoin="round" aria-label="Set by Genie"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.8L12 16.5l-1.8-5L5 9.7l5.2-1.8z"></path></svg>
      </sc-if>
      <span>{{chip.label}}</span>
      <button type="button" onClick="{{chip.remove}}" aria-label="Remove filter {{chip.label}}" style="width: 26px; height: 26px; margin-right: -8px; border: none; background: transparent; color: #24285D; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>

        <div style="position: relative; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">

          </label>
          <button type="button" onClick="{{plToggleFilters}}" aria-expanded="{{plFiltersAttr}}" style="{{plFiltersStyle}}">

              <div style="display: flex; flex-direction: column; gap: 6px;">

        <sc-if value="{{plHasPills}}" hint-placeholder-val="{{false}}">

        <sc-if value="{{plHasBanner}}" hint-placeholder-val="{{false}}">

            </button>
          </div>

        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px 10px 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #DADCE8;">

            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.8L12 16.5l-1.8-5L5 9.7l5.2-1.8z"></path></svg>

          <span style="flex: 1 1 260px; min-width: 0; font-size: 14px; line-height: 20px;"><span style="font-weight: 700;">Genie: </span>{{plGenieText}}</span>

          </sc-if>
          <button type="button" onClick="{{plGenieAsk}}" style="height: 32px; padding: 0 12px; border: 1px solid #DADCE8; border-radius: 8px; background: #FFFFFF; color: #24285D; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;">Ask Genie</button>

        <sc-if value="{{plIsBoard}}" hint-placeholder-val="{{true}}">

                <span style="padding: 0 4px; margin-top: -6px; font-size: 12px; line-height: 16px; color: #474945; font-variant-numeric: tabular-nums; min-height: 16px;">{{col.total}}</span>

                      <span aria-label="{{c.files}} files" style="{{c.iconStyle}}">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 11.5 12.5 19a5 5 0 0 1-7-7l8-8a3.3 3.3 0 0 1 4.7 4.7L10.5 16a1.7 1.7 0 0 1-2.4-2.4L15 6.8"></path></svg>{{c.files}}</span>

                <sc-if value="{{col.empty}}" hint-placeholder-val="{{false}}">

                <sc-if value="{{col.addOpen}}" hint-placeholder-val="{{false}}">

                    </div>
                  </div>
                </sc-if>
                <button type="button" onClick="{{col.startAdd}}" style="{{col.addBtnStyle}}">{{col.addLabel}}</button>

        <sc-if value="{{plIsList}}" hint-placeholder-val="{{false}}">
